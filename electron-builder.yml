appId: com.cinemaauth.agent
productName: HK票务助手
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,read.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!release{,/**/*}'
  - '!docs{,/**/*}'
  - '!.tmp{,/**/*}'
  - '!.temp{,/**/*}'
  - '!.buildcheck{,/**/*}'
  - '!*.log'
asarUnpack:
  - resources/**
electronLanguages:
  - en-US
  - zh-CN
win:
  executableName: HK票务助手
nsis:
  artifactName: ${productName}.${ext}
  shortcutName: HK票务助手
  uninstallDisplayName: HK票务助手
  createDesktopShortcut: always
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: cinema-auth-agent
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://203.195.196.67/updates/
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
